<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Second Brain</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Second Brain" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <script>
    // Apply the saved theme before first paint (no white flash in dark mode).
    // Same key/logic as src/lib/theme.js.
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('sb-theme') || 'light'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1318');
      }
    })();
  </script>
  <style>
    /* Inline loading screen — visible immediately, before any JS parses.
       The brand mark draws itself (outline → folds → circuit → nodes), the
       name rises, then the mark "breathes" while the app loads. Paths are the
       same as src/components/ui/logo.jsx. React mounts into #root and the
       script below fades this out. */
    #app-loading {
      --g1: #c026d3; --g2: #8b5cf6; --g3: #22d3ee;
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #ffffff;
      z-index: 9999;
      transition: opacity .25s ease;
    }
    #app-loading.out { opacity: 0; pointer-events: none; }
    #app-loading svg { width: 112px; height: 112px; overflow: visible; animation: sb-breathe 2.6s ease-in-out 2.4s infinite; }
    #app-loading .ln { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1 2; stroke-dashoffset: 1; opacity: 0;
      animation: sb-draw var(--d) cubic-bezier(.6,0,.2,1) var(--t) forwards; }
    #app-loading .dots { animation: sb-pulse 2.6s ease-in-out 2.4s infinite; }
    #app-loading .dot { fill: none; stroke-width: 9; transform-box: fill-box; transform-origin: center;
      transform: scale(0); animation: sb-pop .35s cubic-bezier(.3,1.6,.5,1) var(--t) forwards; }
    #app-loading .label {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
      font-size: 26px;
      color: #1f2937;
      opacity: 0;
      transform: translateY(6px);
      animation: sb-rise .6s ease-out 1.7s forwards;
    }
    @keyframes sb-draw { 0% { opacity: 0; } 1% { opacity: 1; } 100% { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes sb-pop { to { transform: scale(1); } }
    @keyframes sb-rise { to { opacity: 1; transform: none; } }
    @keyframes sb-breathe { 50% { transform: scale(1.035); } }
    @keyframes sb-pulse { 50% { opacity: .55; } }

    /* Dark theme loading screen — graphite, brighter gradient. */
    html.dark { background: #0f1318; }
    html.dark #app-loading { background: #0f1318; --g1: #e879f9; --g2: #a78bfa; --g3: #67e8f9; }
    html.dark #app-loading .label { color: #e6e9ee; }

    @media (prefers-reduced-motion: reduce) {
      #app-loading svg, #app-loading .ln, #app-loading .dots, #app-loading .dot, #app-loading .label {
        animation: none; stroke-dashoffset: 0; opacity: 1; transform: none;
      }
    }
  </style>
</head>

<body>
  <div id="app-loading">
    <svg viewBox="0 0 256 256" aria-hidden="true">
      <defs>
        <linearGradient id="sb-load-g" x1="0" y1="28" x2="0" y2="228" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="var(--g1)" /><stop offset=".5" stop-color="var(--g2)" /><stop offset="1" stop-color="var(--g3)" />
        </linearGradient>
      </defs>
      <g stroke="url(#sb-load-g)">
        <path class="ln" pathLength="1" style="--d:1.1s;--t:0s" d="M128 40 C121 28 101 27 95 40 C80 36 66 47 70 62 C56 66 50 82 58 95 C46 104 45 124 56 132 C46 144 50 164 64 169 C62 185 75 198 90 195 C96 211 117 219 128 210" />
        <path class="ln" pathLength="1" style="--d:.7s;--t:.25s" d="M128 40 V210" />
        <path class="ln" pathLength="1" style="--d:.4s;--t:.8s" d="M95 40 C98 50 106 56 114 56" />
        <path class="ln" pathLength="1" style="--d:.4s;--t:.9s" d="M70 62 C80 64 86 72 86 80" />
        <path class="ln" pathLength="1" style="--d:.4s;--t:1s" d="M100 96 L106 103 L112 96" />
        <path class="ln" pathLength="1" style="--d:.4s;--t:1.05s" d="M56 132 C68 130 78 136 80 146" />
        <path class="ln" pathLength="1" style="--d:.4s;--t:1.1s" d="M98 140 C108 140 114 148 112 156" />
        <path class="ln" pathLength="1" style="--d:.4s;--t:1.15s" d="M90 195 C92 182 102 176 112 178" />
        <path class="ln" pathLength="1" style="--d:.45s;--t:1s" d="M128 70 H146 L166 50 H172" />
        <path class="ln" pathLength="1" style="--d:.45s;--t:1.08s" d="M128 100 H158 L172 86 H186" />
        <path class="ln" pathLength="1" style="--d:.45s;--t:1.16s" d="M128 128 H198" />
        <path class="ln" pathLength="1" style="--d:.45s;--t:1.24s" d="M128 156 H158 L172 170 H186" />
        <path class="ln" pathLength="1" style="--d:.45s;--t:1.32s" d="M128 186 H146 L166 206 H172" />
        <g class="dots">
          <circle class="dot" cx="181" cy="50" r="9" style="--t:1.4s" />
          <circle class="dot" cx="195" cy="86" r="9" style="--t:1.48s" />
          <circle class="dot" cx="207" cy="128" r="9" style="--t:1.56s" />
          <circle class="dot" cx="195" cy="170" r="9" style="--t:1.64s" />
          <circle class="dot" cx="181" cy="206" r="9" style="--t:1.72s" />
        </g>
      </g>
    </svg>
    <div class="label">Second Brain</div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Fade the loading overlay out as soon as React renders into #root
    const observer = new MutationObserver(() => {
      if (document.getElementById('root').childElementCount > 0) {
        const el = document.getElementById('app-loading');
        if (el) { el.classList.add('out'); setTimeout(() => el.remove(), 300); }
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });
  </script>
</body>

</html>
